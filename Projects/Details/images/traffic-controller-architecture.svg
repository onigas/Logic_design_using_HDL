<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><rect width="1000" height="460" rx="16" fill="#f7f9fc"/><text x="500" y="38" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#1c3654" text-anchor="middle">Project 05 — Traffic Controller Architecture</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#537899"/></marker></defs><rect x="35" y="100" width="177" height="70" rx="10" fill="#e7eff8" stroke="#7d9fbe" stroke-width="1.8"/><text x="123.5" y="128" text-anchor="middle" font-family="Arial" font-size="18" fill="#1d3553">Push Buttons</text><text x="123.5" y="151" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677e">Pedestrian requests</text><rect x="35" y="285" width="177" height="70" rx="10" fill="#e7eff8" stroke="#7d9fbe" stroke-width="1.8"/><text x="123.5" y="313" text-anchor="middle" font-family="Arial" font-size="18" fill="#1d3553">Clock Enable</text><text x="123.5" y="336" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677e">1 Hz timebase</text><rect x="290" y="98" width="196" height="75" rx="10" fill="#e7eff8" stroke="#7d9fbe" stroke-width="1.8"/><text x="388" y="128.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#1d3553">Input Logic</text><text x="388" y="151.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677e">Sync + debounce</text><rect x="295" y="283" width="190" height="75" rx="10" fill="#e7eff8" stroke="#7d9fbe" stroke-width="1.8"/><text x="390" y="313.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#1d3553">Phase Timer</text><text x="390" y="336.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677e">Countdown register</text><rect x="555" y="143" width="194" height="104" rx="10" fill="#e7eff8" stroke="#7d9fbe" stroke-width="1.8"/><text x="652" y="188" text-anchor="middle" font-family="Arial" font-size="18" fill="#1d3553">Traffic FSM</text><text x="652" y="211" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677e">Vehicles + pedestrian phases</text><rect x="815" y="92" width="152" height="76" rx="10" fill="#e7eff8" stroke="#7d9fbe" stroke-width="1.8"/><text x="891" y="123" text-anchor="middle" font-family="Arial" font-size="18" fill="#1d3553">LED Signals</text><text x="891" y="146" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677e">Vehicle / pedestrian</text><rect x="808" y="282" width="162" height="78" rx="10" fill="#e7eff8" stroke="#7d9fbe" stroke-width="1.8"/><text x="889" y="314" text-anchor="middle" font-family="Arial" font-size="18" fill="#1d3553">VGA Renderer</text><text x="889" y="337" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677e">Colors + countdown</text><path d="M212 135H290" fill="none" stroke="#537899" stroke-width="2.5" marker-end="url(#arr)"/><path d="M212 320H295" fill="none" stroke="#537899" stroke-width="2.5" marker-end="url(#arr)"/><path d="M486 135H520V172H555" fill="none" stroke="#537899" stroke-width="2.5" marker-end="url(#arr)"/><path d="M485 320H523V218H555" fill="none" stroke="#537899" stroke-width="2.5" marker-end="url(#arr)"/><path d="M749 175H780V130H815" fill="none" stroke="#537899" stroke-width="2.5" marker-end="url(#arr)"/><path d="M749 217H778V321H808" fill="none" stroke="#537899" stroke-width="2.5" marker-end="url(#arr)"/><path d="M390 283V264H555" fill="none" stroke="#537899" stroke-width="2.5" marker-end="url(#arr)"/><text x="500" y="418" font-family="Arial" font-size="14" fill="#354b65" text-anchor="middle">The VGA indicators and countdown use the SAME FSM state and timer values as the actual light outputs.</text></svg>