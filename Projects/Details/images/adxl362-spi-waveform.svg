<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530"><rect width="1120" height="530" rx="12" fill="#f8fafc"/><text x="560" y="38" fill="#263c56" font-family="Arial" font-size="24" text-anchor="middle">Project 06 — ADXL362 SPI Register Read (Mode 0)</text><text x="27" y="110" fill="#263c56" font-family="Arial" font-size="17" text-anchor="start">CS (active low)</text><text x="27" y="190" fill="#263c56" font-family="Arial" font-size="17" text-anchor="start">SCLK</text><text x="27" y="280" fill="#263c56" font-family="Arial" font-size="17" text-anchor="start">MOSI</text><text x="27" y="370" fill="#263c56" font-family="Arial" font-size="17" text-anchor="start">MISO</text><line x1="240" y1="85" x2="1008" y2="85" stroke="#d4dfe9"/><line x1="240" y1="151" x2="1008" y2="151" stroke="#d4dfe9"/><line x1="240" y1="237" x2="1008" y2="237" stroke="#d4dfe9"/><line x1="240" y1="327" x2="1008" y2="327" stroke="#d4dfe9"/><path d="M205 84H228V112H1018V84H1043" fill="none" stroke="#3c779c" stroke-width="2.5"/><path d="M205 " fill="none" stroke="#3c779c" stroke-width="2.4"/><rect x="241" y="244" width="254" height="48" rx="5" fill="#dceafa" stroke="#92aac0"/><text x="368" y="273" fill="#263c56" font-family="Arial" font-size="15" text-anchor="middle">0x0B — READ opcode</text><rect x="497" y="244" width="254" height="48" rx="5" fill="#d9f1e5" stroke="#92aac0"/><text x="624" y="273" fill="#263c56" font-family="Arial" font-size="15" text-anchor="middle">0x0E — XDATA_L</text><rect x="753" y="244" width="254" height="48" rx="5" fill="#fff0d5" stroke="#92aac0"/><text x="880" y="273" fill="#263c56" font-family="Arial" font-size="15" text-anchor="middle">Dummy bits (MOSI)</text><rect x="241" y="336" width="510" height="48" rx="5" fill="#eff2f6" stroke="#b7c4d3"/><text x="496" y="365" fill="#263c56" font-family="Arial" font-size="15" text-anchor="middle">Ignored / high impedance</text><rect x="753" y="336" width="254" height="48" rx="5" fill="#e9e3fa" stroke="#9d8bbe"/><text x="880" y="365" fill="#263c56" font-family="Arial" font-size="15" text-anchor="middle">XDATA_L byte</text><line x1="496" y1="133" x2="496" y2="387" stroke="#95adc3" stroke-width="1.5" stroke-dasharray="5 6"/><line x1="752" y1="133" x2="752" y2="387" stroke="#95adc3" stroke-width="1.5" stroke-dasharray="5 6"/><text x="560" y="433" fill="#263c56" font-family="Arial" font-size="17" text-anchor="middle">24 SCLK cycles while CS is low: 8-bit command + 8-bit address + 8-bit response.</text><text x="560" y="459" fill="#263c56" font-family="Arial" font-size="14" text-anchor="middle">SPI mode 0 shown schematically; MOSI/MISO blocks represent bytes, not individual bit values.</text><text x="560" y="487" fill="#263c56" font-family="Arial" font-size="14" text-anchor="middle">For X, Y, Z acquisition, continue clocking to read successive registers in one burst.</text></svg>